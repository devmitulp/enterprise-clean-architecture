<div class="relative isolate overflow-hidden bg-slate-50 dark:bg-slate-950 min-h-[calc(100vh-4rem)] flex flex-col justify-center items-center px-6 lg:px-8">
  
  <!-- Top Decorative Blur -->
  <div class="absolute inset-x-0 -top-40 -z-10 transform-gpu overflow-hidden blur-3xl sm:-top-80" aria-hidden="true">
    <div class="relative left-[calc(50%-11rem)] aspect-1155/678 w-[36rem] -translate-x-1/2 rotate-[30deg] bg-gradient-to-tr from-violet-300 to-indigo-500 opacity-20 sm:left-[calc(50%-30rem)] sm:w-[72rem]"></div>
  </div>

  <!-- Hero Section -->
  <div class="mx-auto max-w-3xl text-center py-16 sm:py-24">
    <span class="inline-flex items-center gap-x-2 rounded-full px-3 py-1 text-xs font-semibold leading-5 text-indigo-600 bg-indigo-50 dark:text-indigo-400 dark:bg-indigo-950/30 ring-1 ring-inset ring-indigo-500/10 dark:ring-indigo-400/20 mb-6">
      Angular 22 + Clean Architecture
    </span>
    <h1 class="text-4xl font-extrabold tracking-tight sm:text-6xl bg-gradient-to-r from-slate-900 via-violet-950 to-slate-900 dark:from-white dark:via-indigo-300 dark:to-white bg-clip-text text-transparent">
      Enterprise Web Applications Redefined
    </h1>
    <p class="mt-6 text-lg leading-8 text-slate-600 dark:text-slate-400 max-w-xl mx-auto">
      Scale to hundreds of modules and thousands of components using our highly decoupled, testable, and robust Clean Architecture skeleton.
    </p>
    <div class="mt-10 flex items-center justify-center gap-x-6">
      <a [routerLink]="[routePaths.LOGIN]" 
         class="rounded-xl bg-gradient-to-r from-violet-600 to-indigo-600 px-6 py-3 text-sm font-semibold text-white shadow-lg hover:from-violet-500 hover:to-indigo-500 hover:shadow-indigo-500/30 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-indigo-600 transition-all duration-150">
        Get Started
      </a>
      <a [routerLink]="[routePaths.ABOUT]" class="text-sm font-semibold leading-6 text-slate-900 dark:text-slate-200 hover:text-indigo-600 dark:hover:text-indigo-400 transition-colors">
        Learn more <span aria-hidden="true">→</span>
      </a>
    </div>
  </div>

  <!-- Bottom Decorative Blur -->
  <div class="absolute inset-x-0 top-[calc(100%-13rem)] -z-10 transform-gpu overflow-hidden blur-3xl sm:top-[calc(100%-30rem)]" aria-hidden="true">
    <div class="relative left-[calc(50%+3rem)] aspect-1155/678 w-[36rem] -translate-x-1/2 bg-gradient-to-tr from-violet-300 to-indigo-500 opacity-20 sm:left-[calc(50%+36rem)] sm:w-[72rem]"></div>
  </div>
</div>
