<!-- Public Navigation Header -->
<header class="sticky top-0 z-50 w-full border-b border-slate-200/60 bg-white/70 backdrop-blur-md dark:border-slate-800/60 dark:bg-slate-900/70 transition-colors duration-300">
  <div class="mx-auto flex h-16 max-w-7xl items-center justify-between px-4 sm:px-6 lg:px-8">
    
    <!-- Company Logo (Left) -->
    <div class="flex items-center gap-3">
      <div class="flex h-10 w-10 items-center justify-center rounded-xl bg-gradient-to-tr from-violet-600 to-indigo-600 text-white shadow-lg shadow-indigo-500/20">
        <i class="pi pi-compass text-xl animate-pulse"></i>
      </div>
      <span class="text-xl font-bold tracking-tight bg-gradient-to-r from-violet-600 to-indigo-600 bg-clip-text text-transparent dark:from-violet-400 dark:to-indigo-400">
        ANTIGRAVITY
      </span>
    </div>

    <!-- Company Navigation (Right) -->
    <nav class="flex items-center gap-1 sm:gap-4">
      <a [routerLink]="[routePaths.LOGIN]" 
         class="ml-2 inline-flex items-center justify-center rounded-xl bg-gradient-to-r from-violet-600 to-indigo-600 px-4 py-2 text-sm font-semibold text-white shadow-md hover:from-violet-500 hover:to-indigo-500 hover:shadow-lg hover:shadow-indigo-500/20 active:scale-95 transition-all duration-150">
         Login
      </a>
    </nav>
    
  </div>
</header>

<!-- Main Page Content Area -->
<main class="flex-grow">
  <router-outlet></router-outlet>
</main>
