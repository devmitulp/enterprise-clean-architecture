<div
  class="flex h-screen w-screen overflow-hidden bg-slate-50 dark:bg-slate-950 text-slate-800 dark:text-slate-100 transition-colors duration-300"
>
  <!-- Left Sidebar Component -->
  <app-sidebar
    [isCollapsed]="isSidebarCollapsed()"
    [menuItems]="authorizedMenuItems()"
    (toggleSidebar)="toggleSidebar()"
  ></app-sidebar>

  <!-- Right Main Layout Panel -->
  <div class="flex-grow flex flex-col h-full overflow-hidden">
    <!-- Topbar Header Component -->
    <app-topbar
      [isSidebarCollapsed]="isSidebarCollapsed()"
      (toggleSidebar)="toggleSidebar()"
    ></app-topbar>

    <!-- Content Workspace -->
    <div class="flex-grow overflow-y-auto p-6 bg-slate-50 dark:bg-slate-950/40">
      <div class="w-full h-full flex flex-col">
        <router-outlet></router-outlet>
      </div>
    </div>

    <!-- Footer Component -->
    <app-footer></app-footer>
  </div>
</div>
