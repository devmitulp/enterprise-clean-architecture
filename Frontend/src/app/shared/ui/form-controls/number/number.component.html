<div class="w-full flex flex-col gap-1.5">
  @if (label) {
    <label [for]="id" class="text-xs font-semibold text-slate-700 dark:text-slate-300">
      {{ label }}
      @if (required) {
        <span class="text-rose-500 font-bold">*</span>
      }
    </label>
  }

  <div
    [class.border-rose-500]="
      displayControl?.invalid && (displayControl?.dirty || displayControl?.touched)
    "
    [class.ring-rose-500]="
      displayControl?.invalid && (displayControl?.dirty || displayControl?.touched)
    "
    [class.opacity-60]="disabled"
    [class.pointer-events-none]="disabled"
    class="relative flex items-center w-full rounded-xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 shadow-sm focus-within:border-indigo-500 focus-within:ring-2 focus-within:ring-indigo-500/25 transition-all duration-200"
  >
    <p-inputgroup class="w-full">
      @if (icon) {
        <p-inputgroup-addon>
          <i [class]="icon"></i>
        </p-inputgroup-addon>
      }
      @if (prefix) {
        <p-inputgroup-addon>
          <span class="text-sm text-slate-500 dark:text-slate-400">{{ prefix }}</span>
        </p-inputgroup-addon>
      }

      <p-inputnumber
        [inputId]="id"
        [formControl]="control"
        [readonly]="readonly"
        [placeholder]="placeholder"
        [min]="min ?? null"
        [max]="max ?? null"
        [useGrouping]="useGrouping"
        [minFractionDigits]="minFractionDigits ?? null"
        [maxFractionDigits]="maxFractionDigits ?? null"
        [autofocus]="autofocus"
        [pTooltip]="tooltip"
        tooltipPosition="top"
        (onBlur)="onBlur()"
        class="w-full"
        inputStyleClass="w-full py-2.5 px-3.5 text-sm bg-transparent focus:outline-none placeholder-slate-400 text-slate-900 dark:text-white border-0 shadow-none"
        [class.no-left-border]="!!icon || !!prefix"
        [attr.aria-required]="required || null"
        [attr.aria-invalid]="(displayControl?.invalid && (displayControl?.dirty || displayControl?.touched)) || null"
        [attr.aria-describedby]="(displayControl?.invalid && (displayControl?.dirty || displayControl?.touched)) ? id + '-error' : null"
      ></p-inputnumber>

      @if (suffix) {
        <p-inputgroup-addon>
          <span class="text-sm text-slate-500 dark:text-slate-400">{{ suffix }}</span>
        </p-inputgroup-addon>
      }
    </p-inputgroup>
  </div>

  @if (hint && !(displayControl?.invalid && (displayControl?.dirty || displayControl?.touched))) {
    <span class="text-xs text-slate-500 dark:text-slate-400">{{ hint }}</span>
  }

  @if (displayControl) {
    <app-form-error [control]="displayControl" [label]="label" [id]="id"></app-form-error>
  }
</div>
