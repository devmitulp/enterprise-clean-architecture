@if (isLoading()) {
  <div
    class="fixed inset-0 z-[9999] flex items-center justify-center bg-slate-900/60 backdrop-blur-md transition-all duration-300 animate-fade-in"
  >
    <div
      class="flex flex-col items-center justify-center gap-4 p-8 rounded-3xl bg-white/10 dark:bg-slate-950/20 border border-white/20 dark:border-slate-800/30 shadow-2xl backdrop-blur-xl"
    >
      <!-- Premium Spinner -->
      <div class="relative flex h-16 w-16 items-center justify-center">
        <div
          class="absolute inset-0 rounded-full border-4 border-t-indigo-600 border-r-violet-600 border-b-slate-200/20 border-l-slate-200/20 animate-spin"
        ></div>
        <div
          class="absolute h-10 w-10 rounded-full bg-gradient-to-tr from-violet-500/20 to-indigo-500/20 blur-sm"
        ></div>
        <i class="fa-regular fa-compass text-base text-indigo-500 animate-pulse"></i>
      </div>
    </div>
  </div>
}
