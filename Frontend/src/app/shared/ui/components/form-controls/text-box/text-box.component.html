<div class="w-full flex flex-col gap-1.5">
  @if (label) {
    <label [for]="id" class="text-xs font-semibold text-slate-700 dark:text-slate-300">
      {{ label }}
      @if (required) {
        <span class="text-rose-500 font-bold">*</span>
      }
    </label>
  }

  <div
    [class.border-rose-500]="control?.invalid && (control?.dirty || control?.touched)"
    [class.ring-rose-500]="control?.invalid && (control?.dirty || control?.touched)"
    [class.opacity-60]="disabled"
    [class.pointer-events-none]="disabled"
    class="relative flex items-center w-full rounded-xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 shadow-sm focus-within:border-indigo-500 focus-within:ring-2 focus-within:ring-indigo-500/25 transition-all duration-200"
  >
    <p-inputgroup class="w-full">
      <!-- @if (icon) {
      <div
        class="pl-3.5 pr-2.5 text-slate-400 dark:text-slate-500 flex items-center justify-center"
      >
        <i [class]="icon"></i>
      </div>
    } -->
      @if (icon) {
        <p-inputgroup-addon>
          <i [class]="icon"></i>
        </p-inputgroup-addon>
      }

      <input
        pInputText
        type="text"
        [id]="id"
        [formControl]="control"
        [readonly]="readonly"
        [maxlength]="maxLength ?? null"
        [placeholder]="placeholder"
        (blur)="onBlur()"
        class="w-full py-2.5 px-3.5 text-sm bg-transparent rounded-xl focus:outline-none placeholder-slate-400 text-slate-900 dark:text-white"
        [class.no-left-border]="!!icon"
      />
    </p-inputgroup>
  </div>

  @if (control) {
    <app-form-error [control]="control"></app-form-error>
  }
</div>
